[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Dataset-driven evaluation and regression gating for a RAG support assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28"]

[project.scripts]
evalh = "evalh.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-cov>=7.0", "ruff>=0.14", "mypy>=1.18"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
